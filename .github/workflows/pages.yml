name: Update index and deploy

# Runs every night, on every push to main, and by hand from the Actions tab.
# Rebuilds data.js from the latest Osmantic/ODS, runs the tests, saves the new
# index if anything changed, then publishes the site to GitHub Pages.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get the latest ODS
        run: git clone --depth 1 https://github.com/Osmantic/ODS "$RUNNER_TEMP/ods-source"

      - name: Rebuild the search index
        run: node build-index.js "$RUNNER_TEMP/ods-source" data.js

      # If ODS renamed a doc that a recipe points at, recipes.test.js fails here,
      # nothing is saved or published, and the live site keeps the last good index.
      - name: Run the tests
        run: node --test

      - name: Save the new index
        run: |
          if git diff --quiet -- data.js; then
            echo "The index is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js
            git commit -m "Update the search index from Osmantic/ODS $(git -C "$RUNNER_TEMP/ods-source" rev-parse --short HEAD)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
